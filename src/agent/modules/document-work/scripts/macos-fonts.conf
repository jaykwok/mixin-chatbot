<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LibreOffice for macOS looks fonts up through its bundled fontconfig, which sees only LibreOffice's own fonts when
     run headless: Chinese text vanished from previews. document_ops.py points FONTCONFIG_FILE here on macOS. The system
     font directories, a cache under the job's XDG_CACHE_HOME, and the common Windows Chinese fonts mapped to the ones
     macOS ships (Hiragino Sans GB, Heiti SC, Songti SC). -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Hiragino Sans GB</family><family>Heiti SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Hiragino Sans GB</family><family>Heiti SC</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>Hiragino Sans GB</family><family>Heiti SC</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Hiragino Sans GB</family><family>Heiti SC</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>Heiti SC</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Heiti SC</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>楷体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>Songti SC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Hiragino Sans GB</family><family>Heiti SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Songti SC</family></prefer></alias>
</fontconfig>
