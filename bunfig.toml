# 不自动读取工作目录里的 .env：运行参数只来自 data/config/runtime.json 和显式设置的环境变量（Windows 机器人、控制台、
# 运维脚本都在项目根运行，多出一个 .env 会悄悄改变它们的取值）。
env = false

[test]
# 只从 tests/ 发现用例。
#
# bun test 的位置参数是子串过滤而不是精确路径，而 backup/tmp 下会留下仓库副本和历史运行的
# 工作目录——`bun test tests/ops/` 会连副本里的同名用例一起跑。那些副本嵌套很深，在 Windows
# 上直接撞 260 字符路径上限，于是失败的是路径长度，看起来却像是被测代码坏了。
# 把发现范围钉死在真正的测试树上，直接 bun test 也不会再跑到临时目录里去。
root = "tests"
