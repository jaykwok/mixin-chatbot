name: macOS spike
on:
  push:
    branches: [ci/macos-spike]
permissions:
  contents: read
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Probe
        run: SPIKE_REPORT="${{ runner.temp }}/report.json" bun spike/probe.ts
        continue-on-error: true
      - name: launchd
        run: bash spike/launchd.sh 2>&1 | tee "${{ runner.temp }}/launchd.log"
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/launchd.log
