name: Agent checks (temporary copy)
on:
  push:
    branches: [ci/macos]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The first-transition tests run the recovery entry of an earlier commit (see target-upgrader.test.ts).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Homebrew bash 5 and coreutils (macOS deployments require them)
        if: runner.os == 'macOS'
        run: |
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # tests/run.ts runs timing-balanced groups in parallel, one isolated run each (one per spare core, at most four on Windows and six elsewhere).
      # The recorded per-file times have the format of tests/timings/<platform>.json, which they can replace.
      - name: Isolated tests and JUnit report
        run: bun run test --reporter=junit --reporter-outfile="${{ runner.temp }}/mixin-tests.xml" --record-timings="${{ runner.temp }}/mixin-test-timings.json"
      - run: bun run deadcode
      - run: bun run deadcode --production
      - name: Dependency vulnerability audit
        if: runner.os == 'Linux'
        run: bun audit
      - name: PowerShell syntax and UTF-8 BOM
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw "Missing UTF-8 BOM: $_" }
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: macOS bootstrap syntax under the system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash -n scripts/lib/macos-entry.sh
      - name: Real LaunchDaemon, service account, console task and Office preview (root)
        if: runner.os == 'macOS'
        run: |
          brew install uv oven-sh/bun/bun
          brew install --cask libreoffice
          # The service account runs this Python, so it is uv's own build outside the runner's home, not Homebrew's.
          export UV_PYTHON_INSTALL_DIR=/tmp/mixin-office-py UV_PYTHON_PREFERENCE=only-managed
          UV_PROJECT_ENVIRONMENT=/tmp/mixin-office-venv uv sync --frozen
          chmod -R a+rX /tmp/mixin-office-py /tmp/mixin-office-venv
          sudo env MIXIN_TEST_REAL_LAUNCHD=1 MIXIN_TEST_MACOS_TOOLS=1 MIXIN_TEST_OFFICE_PYTHON=/tmp/mixin-office-venv/bin/python \
            "$(command -v bun)" test tests/ops/core-real-launchd.test.ts
      - name: Preserve test diagnostics and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mixin-tests.xml
            ${{ runner.temp }}/mixin-test-timings.json
            tmp/tests-*.log
          if-no-files-found: ignore
          retention-days: 7
